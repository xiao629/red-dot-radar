
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install opencv-python mss numpy pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "小地圖紅點雷達" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: 小地圖紅點雷達-Windows-x64
          path: dist/小地圖紅點雷達.exe
